apiVersion: rbac.authorization.k8s.io/v1
kind: Role 
metadata:
 name: pi-agent-role
 namespace: pi-agent
rules:
 - apiGroups: [""]
   resources: ["pods"]
   verbs: ["get" ,"list" , "watch"]
 - apiGroups: [""]
   resources: ["pods/exec"]
   verbs: ["get" , "create"]
 - apiGroups: [""]
   resources: ["pods/log"]
   verbs: ["get"]
 - apiGroups: ["coordination.k8s.io"]
   resources: ["leases"]
   verbs: ["get" , "list" , "create" , "update" , "patch"]